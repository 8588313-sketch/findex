name: CI

on:
  push:
    branches: [main]
    tags: ["v*", "lab-*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Typecheck with pyright (strict)
        run: uv run pyright
      - name: Run test suite with pytest-benchmark
        run: uv run pytest -m "not slow" --benchmark-only --benchmark-min-rounds=5 && uv run pytest -m "not slow" --benchmark-disable

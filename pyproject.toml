[project]
name = "findex"
version = "0.5.0"
description = "Fast streaming inverted index and ranked Boolean/phrase search engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.120.0",
    "matplotlib>=3.9.0",
    "pyright>=1.1.390",
    "pytest>=9.2.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.17.6",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src/findex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that take more than 1 second to run",
]

[tool.coverage.run]
source = ["findex"]
omit = [
    "src/findex/bench.py",
    "src/findex/bench_lab3.py",
    "src/findex/bench_lab5.py",
    "src/findex/eager.py",
]
